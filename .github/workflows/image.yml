name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.17"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run pytest -q
      - uses: docker/setup-buildx-action@v4
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build image for verification
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: doc-pipeline:smoke
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Process a document offline
        run: |
          set -euo pipefail
          work_dir="$(mktemp -d)"
          trap 'rm -rf "$work_dir"' EXIT
          mkdir -p "$work_dir/in" "$work_dir/out"
          printf '# Smoke\n\nOffline document processing.\n' > "$work_dir/in/document.md"
          cp config.example.toml "$work_dir/config.toml"
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -v "$work_dir/in:/in:ro" -v "$work_dir/out:/out" \
            -v "$work_dir/config.toml:/config/config.toml:ro" \
            doc-pipeline:smoke /in/document.md --out /out --config /config/config.toml

          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -v "$work_dir/out:/out:ro" --entrypoint python doc-pipeline:smoke -c '
          import json
          from pathlib import Path
          out = Path("/out")
          report = json.loads((out / "report.json").read_text())
          chunks = [json.loads(line) for line in (out / "chunks.jsonl").read_text().splitlines()]
          assert report["parse_status"] == "complete", report
          assert report["chunk_count"] == len(chunks) == 1, report
          assert report["chunking"] == {"target_input_bytes": 2400, "max_input_bytes": 6000}, report
          assert report["embedding"] is None and report["embedding_count"] == 0, report
          assert report["embedding_errors"] == [], report
          assert (out / "embeddings.jsonl").read_text() == ""
          assert "Offline document processing." in (out / "content.md").read_text()
          assert chunks[0]["embedding_input"] == "Smoke\n\nOffline document processing."
          assert chunks[0]["citations"]
          print("Offline Docker smoke test passed.")'
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the verified image
        if: github.event_name != 'pull_request'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker tag doc-pipeline:smoke "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
